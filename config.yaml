database:
  host: "x.x.x.x"
  port: 5432
  user: "postgres"
  password: "difyai123456"
  dbname: "dify"

admins:
  - "admin1@example.com"
  - "admin2@example.com"
  - "admin3@example.com"

# Dify 使用的 Redis 配置（用于在重置密码后清除登录失败限流计数）
redis:
  host: "x.x.x.x"
  port: 6379
  password: "difyai123456"
  db: 0

# Dify Console API 配置（用于调用插件安装等接口）
dify:
  console_api_url: "http://x.x.x.x:5001"  # Dify API 服务地址
  admin_email: "admin1@example.com"   # 用于登录 Dify 获取 token 的管理员邮箱
  admin_password: "adminpwd"                         # 管理员密码
  # 新建 workspace 时自动安装的插件列表（plugin_unique_identifier）
  # 格式: org/name:version@hash，可从已有 workspace 的插件安装记录中获取
  default_plugins:
    - "langgenius/openai_api_compatible:0.0.42@cf508badd3f6c086c137a6034697e0c48a60038783b3c3ed0af2fe55000842e8"
  # Dify 内部接口（Inner API）配置，用于通过官方接口创建工作空间
  # 前提条件：
  #   1. 在 Dify api 服务增加环境变量：INNER_API=true、INNER_API_KEY=sk-***
  #   2. NGINX 增加 /inner/api 路由：
  #      location /inner/api { proxy_pass http://api:5001; include proxy.conf; }
  inner_api_url: "http://x.x.x.x"              # Dify 服务地址（只需 base URL，代码会自动拼接路由），留空则使用 console_api_url
  inner_api_key: "sk-***"              # 需与 api 服务的 INNER_API_KEY 环境变量保持一致，如 sk-***
